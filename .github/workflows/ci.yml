# Fast pull-request verification (T8). The required check for every PR.
# Deployment never happens here; Pages deploys only through release.yml.
name: CI fast verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-fast:
    name: verify:fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Fast verification (lint, vitest, tdd guard, build, e2e smoke)
        run: npm run verify:fast

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
