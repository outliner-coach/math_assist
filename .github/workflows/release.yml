# Manual production release (T8). The only path to GitHub Pages.
# A push never deploys: a human dispatches this workflow, verify:release must
# pass on the exact ref, and the github-pages environment approval gates the
# actual deployment. Rollbacks use the same lane with an older ref.
name: Production release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to release (empty = current default branch HEAD)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve-ref:
    name: resolve release ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve ref
        id: resolve
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  verify-release:
    name: verify:release + build artifact
    runs-on: ubuntu-latest
    needs: [resolve-ref]
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Release verification (full + evidence + dependency audit + rollback compat)
        run: npm run verify:release
      - name: Upload verified static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-release
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
