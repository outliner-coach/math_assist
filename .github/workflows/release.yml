# Manual Pages deployment (T8). The only path to GitHub Pages.
# A push never deploys. Formal releases require verify:release on the exact ref.
# Device-validation deployments may omit only the evidence check so the public
# build can be tested on physical devices before that evidence is committed.
# The github-pages environment approval gates both modes. Rollbacks use the same
# lane with an older ref.
name: Production release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to release (empty = current default branch HEAD)'
        required: false
        default: ''
      deployment_mode:
        description: 'Formal release or provisional physical-device validation'
        required: true
        type: choice
        default: release
        options:
          - release
          - device-validation

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve-ref:
    name: resolve release ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve ref
        id: resolve
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  verify-release:
    name: verify deployment + build artifact
    runs-on: ubuntu-latest
    needs: [resolve-ref]
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate release metadata for the exact ref
        run: node scripts/generate-release-metadata.mjs
      - name: Formal release verification (full + evidence + dependency audit + rollback compat)
        if: inputs.deployment_mode == 'release'
        run: npm run verify:release
      - name: Device-validation verification (full + dependency audit + rollback compat)
        if: inputs.deployment_mode == 'device-validation'
        run: |
          npm run verify:full
          npm audit --omit=dev --audit-level=high
          node scripts/check-rollback-compat.mjs --check-current
      - name: Generate verified offline release assets
        run: |
          cp public/release-metadata.json out/release-metadata.json
          node scripts/generate-offline-manifests.mjs --out out/offline-packs --metadata out/release-metadata.json --validate-out out
      - name: Upload verified static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-release
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
